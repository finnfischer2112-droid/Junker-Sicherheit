databases:
  - name: junker-sicherheit-db
    plan: free
    databaseName: junker_sicherheit
    user: junker_sicherheit
services:
  - type: web
    name: junker-sicherheit
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/db run push &&
      PORT=10000 BASE_PATH=/ NODE_ENV=production
      pnpm --filter @workspace/junker-sicherheit run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATIC_DIR
        value: ../junker-sicherheit/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: junker-sicherheit-db
          property: connectionString
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
