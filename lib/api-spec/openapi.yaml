openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contactRequests
    description: Kontaktanfragen
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact-requests:
    post:
      operationId: createContactRequest
      tags: [contactRequests]
      summary: Create a contact request
      description: Stores a contact form submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ContactRequestInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          minLength: 3
          maxLength: 200
        phone:
          type: string
          maxLength: 50
        subject:
          type: string
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 5000
        consent:
          type: boolean
      required:
        - name
        - email
        - message
        - consent
    ContactRequest:
      type: object
      properties:
        id:
          type: string
        notificationSent:
          type: boolean
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        message:
          type: string
        consent:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - notificationSent
        - name
        - email
        - message
        - consent
        - createdAt
